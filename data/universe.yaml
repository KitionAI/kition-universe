        preview image.
      zh: 目标是给每个 kit 做一套丰富的官方 Skill，每一个都真实跑过、带预览图。
    cta: { en: Browse Skills on kition.ai, zh: 去 kition.ai 浏览 Skill }
    href: https://kition.ai
  - id: ai
    kind: ai
    name: { en: AI Agent Relay, zh: AI Agent 中继站 }
    angle: -45
    distance: 30
    height: 12
    title: { en: Agents that work on real files., zh: AI 操作真实文件。 }
    body:
      en: Inspect a document, run its kit commands and check the rendered result. KHP exposes the same engine through MCP, with structured errors and previews that let an agent correct its work.
      zh: 观察文档、执行 kit 命令、检查渲染结果。KHP 通过 MCP 暴露同一个引擎，结构化错误和预览让 Agent 能看见结果并纠正操作。
    cta: { en: Explore scenario galaxies, zh: 探索场景星系 }
    href: /scenarios/
  - id: ui
    kind: ui
    name: { en: Tessera Station, zh: Tessera 空间站 }
    angle: -30
    distance: 44
    height: 8
    title: { en: The interface of a whole universe., zh: 整个宇宙，共享界面语言。 }
    body:
      en: Kition Tessera supplies the tokens, icons and professional editor components behind the kits. Ribbons, dock panels, color controls and timelines follow the KHP theme contract.
      zh: Kition Tessera 为 kit 提供设计 Token、图标和专业编辑器组件。功能区、停靠面板、颜色控件和时间轴遵循 KHP 主题协议。
    cta: { en: Explore the UI system, zh: 查看 UI 系统 }
    href: "#interface"

galaxies:
  - id: unknown-1
    name: { en: Unknown galaxy, zh: 未知星系 }
    body:
      en: Build your own on KHP. Any software can become a planet by implementing the Kit Harness Protocol.
      zh: 在 KHP 上造你自己的星系。任何软件实现了 Kit Harness Protocol，都能成为一颗星球。
    href: https://kitharness.org
    position: [-620, 22, -650]
  - id: unknown-2
    name: { en: Unknown galaxy, zh: 未知星系 }
    body:
      en: Build your own on KHP. Any software can become a planet by implementing the Kit Harness Protocol.
      zh: 在 KHP 上造你自己的星系。任何软件实现了 Kit Harness Protocol，都能成为一颗星球。
    href: https://kitharness.org
    position: [620, 34, -650]

# Two ways to build here (2026-10-25): contribute a kit (a new planet that speaks
# KHP, in this galaxy) or build a product on the kits (a settlement in the
# Product Galaxy). Products themselves are in data/products.yaml.
newKit:
  angle: -70
  distance: 46
  height: 2
  name: { en: The next orbit, zh: 下一条轨道 }
  title: { en: Contribute a kit, zh: 贡献一个 kit }
  body:
    en: >-
      Every planet here is a kit: professional software that speaks the Kit Harness Protocol, so people and
      AI agents can both use it. This orbit is empty. Build a kit on KHP and it becomes the next planet.
    zh: 这里的每颗星球都是一个 kit：实现了 Kit Harness Protocol 的专业软件，人和 AI Agent 都能用。这条轨道还空着。在 KHP 上做一个 kit，它就是下一颗星球。
  cta: { en: Read the Kit Harness Protocol, zh: 阅读 Kit Harness Protocol }
  href: https://kitharness.org

productGalaxy:
  name: { en: Product Galaxy, zh: 产品星系 }
  # world position of the galaxy centre; the KHP star sits at the origin
  position: [190, 0, 14]
  blurb:
    en: Products built on the kits. Every kit ships an SDK, so you can put a real spreadsheet, editor or PDF tool inside your own product.
    zh: 用 kit 搭出来的产品。每个 kit 都提供 SDK，你可以把真正的表格、编辑器、PDF 工具放进自己的产品里。
  sdk:
    name: Kition SDK
    license: Apache-2.0
    body:
      en: >-
        The Kition SDK puts any kit inside your own product, in four ways. Kits stay the same
        files and the same commands, so your users and their AI agents get real professional software.
      zh: Kition SDK 能把任何一个 kit 放进你的产品，有四种方式。kit 还是同样的文件、同样的命令，你的用户和他们的 AI Agent 用上的都是真正的专业软件。
    href: https://github.com/KitionAI/kition/blob/main/docs/kits.md
    # the SDK's own guide; each delivery form below links its page of it
    docs: https://github.com/KitionAI/kition-sdk/blob/main/docs/sdk/README.md
  delivery:
    - id: embed
      name: embed
      docs: https://github.com/KitionAI/kition-sdk/blob/main/docs/sdk/embed.md
      body:
        en: Mount a kit's editor in your page, sandboxed in an iframe.
        zh: 把 kit 的编辑器嵌进你的页面，运行在隔离的 iframe 里。
    - id: script
      name: script
      docs: https://github.com/KitionAI/kition-sdk/blob/main/docs/sdk/script.md
      body:
        en: Drive a document from code through the kit's object model.
        zh: 用代码通过 kit 的对象模型操作文档。
    - id: headless
      name: headless
      docs: https://github.com/KitionAI/kition-sdk/blob/main/docs/sdk/headless.md
      body:
        en: Run the kit with no window, to open, edit and save files on a server or in a pipeline.
        zh: 无界面运行 kit，在服务器或流水线里打开、修改、保存文件。
    - id: mcp
      name: mcp
      docs: https://github.com/KitionAI/kition-sdk/blob/main/docs/sdk/agent.md
      body:
        en: Hand the kit's tools to AI agents over MCP.
        zh: 通过 MCP 把 kit 的工具交给 AI Agent。
  add:
    name: { en: Your product here, zh: 你的产品停在这里 }
    title: { en: Add your product planet, zh: 登记你的产品星球 }
    body:
      en: >-
        Built something on a kit? List it here for free. Every product planet is the same size, there are no paid
        spots, and the only condition is a "Built with Kition" badge that links back.
      zh: 用 kit 做了产品？在这里免费登记。所有产品星球一样大，没有付费位置，唯一的条件是放一个链回来的 "Built with Kition" 徽章。
    cta: { en: Add your product planet, zh: 登记你的产品星球 }
