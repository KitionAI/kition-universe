# Kition Universe — the one data file that drives the whole site:
# star map, star catalog, planet pages, sitemap.xml, llms.txt and OG images.
#
# Facts about kits come from the KitionAI/kition repository (paths in `sources`,
# read at the commit checked out on 2026-10-23). Product lines follow the owner
# decisions of 2026-10-31 (office, design, media, engineering). Exactly three kits are in Preview:
# html, design and scene (owner decision 2026-11-21); the others carry no maturity label (never "Beta").
# Do not add numbers or capabilities that have no source. Taglines and summaries claim only what the
# kit's own features.yaml marks `has` (checked against the kit repositories on 2026-11-21).
#
# Kit order is fixed: motion, note, table, board, photo, film, doc, sheet, slide,
# pdf, vector, layout, cad, html, scene, design (motion first; the `order` field decides).
# html, scene and design verified against their kit.json and README.md on 2026-10-31.

site:
  name: Kition Universe
  links:
    main: https://kition.ai
    skills: https://kition.ai
    protocol: https://kitharness.org
    tessera: https://github.com/KitionAI/kition-tessera
    github: https://github.com/KitionAI/kition
    download: https://github.com/KitionAI/kition/releases/latest
    # Built with Kition: submissions and reports are GitHub issue forms in this site's repo
    # (the brief names KitionAI/kition-universe; it does not exist publicly yet)
    submit: https://github.com/KitionAI/kition-universe/issues/new?template=built-with-kition.yml
    report: https://github.com/KitionAI/kition-universe/issues/new?template=report-listing.yml
    # propose a scenario galaxy, and the rules for every kind of submission
    galaxy: https://github.com/KitionAI/kition-universe/issues/new?template=scenario-galaxy.yml
    contributing: https://github.com/KitionAI/kition-universe/blob/main/.github/CONTRIBUTING.md
  facts:
    license: Apache-2.0

star:
  name: Kit Harness Protocol
  short: KHP
  href: https://kitharness.org
  tagline:
    en: The open protocol every planet orbits.
    zh: 每颗星球都绕着转的开放协议。
  lines:
    - en: MCP lets AI connect to tools.
      zh: MCP 让 AI 连上工具。
    - en: KHP lets AI operate professional software.
      zh: KHP 让 AI 操作专业软件。
    - en: Kition is the first open pro suite built on it.
      zh: Kition 是第一套建在它上面的开源专业软件。
  body:
    en: >-
      KHP is the contract between an AI agent and a kit. Every kit answers the same small set of
      calls: inspect a file, list its commands, run one, query, batch, check. Each inspect and run
      comes back with a rendered preview image, and errors are structured (not-found, read-only,
      unknown-command), so an agent can see what it changed and recover when it is wrong. Kits
      declare how far they go, from basic to agent-ready to agent-ready-complete.
    zh: KHP 是 AI Agent 和 kit 之间的约定。每个 kit 都回应同一小组调用：查看文件、列出命令、执行、查询、批量、检查。每次查看和执行都会带回一张渲染好的预览图，错误也是结构化的（not-found、read-only、unknown-command），所以 Agent 能看见自己改了什么，出错时也能自己纠正。每个 kit 会声明自己做到哪一级：basic、agent-ready或 agent-ready-complete。

mcp:
  # the agent tools reference (<kit>_inspect, _run, _check, errors): every "how the AI calls it" link goes here
  docs: https://github.com/KitionAI/kition-sdk/blob/main/docs/sdk/agent.md
  intro:
    en: >-
      Kition ships an MCP server for its kits. Run it over stdio against a folder, without the app open,
      and your agent gets tools like sheet_inspect, sheet_run and sheet_check for every kit.
    zh: Kition 自带一个 kit 的 MCP server。用 stdio 指向一个文件夹运行，不用打开应用，你的 Agent 就会拿到每个 kit 的sheet_inspect、sheet_run、sheet_check 这类工具。
  snippet: |-
    # Claude Code
    claude mcp add kition -- kition-kits-mcp --workspace /path/to/your/folder

    # Any MCP client (mcpServers config)
    {
      "mcpServers": {
        "kition": {
          "command": "kition-kits-mcp",
          "args": ["--workspace", "/path/to/your/folder"]
        }
      }
    }
  note:
    en: The kition-kits-mcp binary comes with Kition Desktop. Without a licence key it runs in development and evaluation mode.
    zh: kition-kits-mcp 随 Kition Desktop 一起提供。没有许可证密钥时，它以开发和评估模式运行。

clusters:
  - id: office
    name: Kition Office
    label: { en: Office Cluster, zh: Office 星团 }
    blurb:
      en: Notes, tables, whiteboards, documents, spreadsheets, slides, PDFs and HTML.
      zh: 笔记、表格、白板、文档、电子表格、幻灯片、PDF 和 HTML。
    angle: -8
    distance: 33
  - id: design
    name: Kition Design
    label: { en: Design Cluster, zh: Design 星团 }
    blurb:
      en: Images, vectors, page layout and interface design.
      zh: 图像、矢量、版式和界面设计。
    angle: 196
    distance: 29
  - id: video
    name: Kition Media
    label: { en: Media Cluster, zh: Media 星团 }
    blurb:
      en: Video editing and motion graphics.
      zh: 视频剪辑和动态图形。
    angle: 140
    distance: 30
  - id: cad
    name: Kition Engineering
    label: { en: Engineering Cluster, zh: 工程星团 }
    blurb:
      en: Technical drawings and complete 3D scenes, from dimensions to animation.
      zh: 从工程制图到三维场景，从精确标注到建模动画。
    angle: 72
    distance: 27

planets:
  # ───────────────────────────── Office ─────────────────────────────
  - id: note
    order: 2
    name: note
    cluster: office
    kitId: kit.note
    planet: { en: Library Planet, zh: 图书馆星 }
    ext: .md
    color: { light: "#5645d4", dark: "#8b7cf0" }
    surface: { style: bands, look: gas, size: 1.18, moons: 1, tilt: 0.2 }
    # what the globe looks like on the star map, in words (keep it true to `surface`)
    world:
      en: "A calm gas giant in soft violet bands, like the edges of a stack of pages. One small moon keeps it company."
      zh: "一颗安静的气态巨行星，淡紫色的条带像一摞书页的侧边。旁边有一颗小卫星。"
    tagline:
      en: Connected Markdown notes your AI can edit and you can review.
      zh: 互相连接的 Markdown 笔记，AI 来改，你来审。
    summary:
      en: >-
        note is Kition's Markdown document kit. Write with live preview, link notes together, add tables,
        tasks and math, and let the agent edit the real file in a draft that you review.
      zh: note 是 Kition 的 Markdown 文档 kit。实时预览写作、把笔记互相链接、插入表格、任务和公式；Agent 在草稿里直接改真实文件，由你审阅。
    capabilities:
      - id: links
        building: { en: Backlink Library, zh: 反链图书馆 }
        shape: dome
        title: { en: Connected notes, zh: 互相连接的笔记 }
        body:
          en: Internal links, backlinks, tags and outlines tie notes together, with embeds, templates and daily notes.
          zh: 内部链接、反向链接、标签和大纲把笔记连在一起，还有嵌入、模板和日记。
      - id: diagrams
        building: { en: Diagram Observatory, zh: 图表天文台 }
        shape: spire
        title: { en: Diagrams and math, zh: 图表和公式 }
        body:
          en: Mermaid diagrams and KaTeX math render right inside the Markdown.
          zh: Mermaid 图表和 KaTeX 公式直接在 Markdown 里渲染。
      - id: search
        building: { en: Search Stacks, zh: 检索书库 }
        shape: stack
        title: { en: Full-text search, zh: 全文检索 }
        body:
          en: Search every note in the workspace, then export finished work to PDF.
          zh: 检索工作区里的所有笔记，写完可以导出成 PDF。
      - id: review
        building: { en: Review Hall, zh: 审阅大厅 }
        shape: columns
        title: { en: Reviewable agent edits, zh: 可审阅的 Agent 修改 }
        body:
          en: The agent edits the active document; every addition and deletion is shown so you can accept or reject it.
          zh: Agent 直接修改当前文档，每处增删都标出来，你可以逐条接受或拒绝。
      - id: comments
        building: { en: Comment Café, zh: 批注咖啡馆 }
        shape: block
        title: { en: Comment threads, zh: 批注讨论 }
        body:
          en: Add, reply to and resolve comment threads, by hand or through the agent.
          zh: 添加、回复和解决批注，可以手动，也可以交给 Agent。
    formats:
      native: [".md", ".markdown"]
      opens: []
    commands:
      - { name: text.read, what: { en: Read the document text, zh: 读取文档文本 } }
      - { name: text.insert, what: { en: Insert text at a position, zh: 在指定位置插入文本 } }
      - { name: text.replace, what: { en: Replace a span of text, zh: 替换一段文本 } }
      - { name: document.replace, what: { en: Rewrite the whole document, zh: 重写整篇文档 } }
      - { name: comment.add, what: { en: Start a comment thread, zh: 发起批注 } }
      - { name: comment.resolve, what: { en: Resolve a thread, zh: 解决批注 } }
    ship:
      en: Agent ship landing on note to link up a week of meeting notes
      zh: Agent 飞船降落 note，把一周的会议笔记串起来
    repo: KitionAI/kition · packages/document-kit
    sources: [README.md, packages/document-kit/kit.json, kits/modules.json, src/lib/script/kits/document.ts]
    tools: []

  - id: table
    order: 3
    name: table
    cluster: office
    kitId: kit.table
    planet: { en: Warehouse Planet, zh: 仓库星 }
    ext: .ktable
    version: 0.2.0
    color: { light: "#0c8375", dark: "#3fd1bf" }
    surface: { style: grid, look: city, size: 0.95 }
    # what the globe looks like on the star map, in words (keep it true to `surface`)
    world:
      en: "A world covered by a regular grid of blocks and lit streets: every lot holds a record, every street links one table to another."
      zh: "整颗星球铺满规整的街区和发光的街道：每个地块是一条记录，每条街把一张表连到另一张表。"
    tagline:
      en: Structured tables that turn data into useful tools.
      zh: 结构化表格，把数据变成好用的工具。
    summary:
      en: >-
        table keeps typed records next to your knowledge: fields, attachments, links between tables, views
        and dashboards. People edit it together live, and the agent reads and writes the same file.
      zh: table 把带类型的记录放在知识旁边：字段、附件、表间关联、视图和仪表盘。多人可以实时一起编辑，Agent 读写的也是同一个文件。
    capabilities:
      - id: fields
        building: { en: Field Depot, zh: 字段仓库 }
        shape: block
        title: { en: Typed fields, zh: 带类型的字段 }
        body:
          en: Typed fields, attachments, formulas and links between tables.
          zh: 带类型的字段、附件、公式，以及表与表之间的关联。
      - id: views
        building: { en: View Hangar, zh: 视图机库 }
        shape: block
        title: { en: Views and dashboards, zh: 视图和仪表盘 }
        body:
          en: Filters, sorting, grouping, multiple views and dashboards over the same records.
          zh: 对同一批记录做筛选、排序、分组，建多个视图和仪表盘。
      - id: ai-fields
        building: { en: AI Field Factory, zh: AI 字段工厂 }
        shape: tower
        title: { en: AI fields, zh: AI 字段 }
        body:
          en: AI fields generate text, structured values and media for every record, so the table is both queue and review surface.
          zh: AI 字段为每条记录生成文本、结构化数据和媒体，表格既是任务队列，也是审阅界面。
      - id: import
        building: { en: Import Dock, zh: 导入码头 }
        shape: crane
        title: { en: Import and export, zh: 导入导出 }
        body:
          en: Import CSV, TSV and XLSX into a table; export CSV and Markdown.
          zh: 把 CSV、TSV、XLSX 导入成表格；导出 CSV 和 Markdown。
      - id: workflows
        building: { en: Workflow Rail, zh: 工作流轨道 }
        shape: screen
        title: { en: Shared with workflows, zh: 和工作流共用 }
        body:
          en: Workflows and form or email sync read and write tables through the kit.
          zh: 工作流、表单和邮件同步都通过这个 kit 读写表格。
    formats:
      native: [".ktable"]
      opens: [".csv", ".tsv", ".xlsx"]
    commands:
      - { name: table.records.create, what: { en: Add records, zh: 新增记录 } }
      - { name: table.records.update, what: { en: Update records, zh: 更新记录 } }
      - { name: table.fields.create, what: { en: Add a field, zh: 新增字段 } }
      - { name: table.views.create, what: { en: Create a view, zh: 新建视图 } }
      - { name: table.import.run, what: { en: Import a file, zh: 导入文件 } }
      - { name: table.csv.export, what: { en: Export CSV, zh: 导出 CSV } }
      - { name: table.dashboards.upsert, what: { en: Build a dashboard, zh: 搭建仪表盘 } }
    ship:
      en: Agent ship landing on table to read receipt photos into records
      zh: Agent 飞船降落 table，把小票照片读成记录
    repo: KitionAI/kition-table
    sources: [README.md, crates/kition-kits/src/manager.rs, docs/table-file-import.md, src/lib/script/kits/table.ts, kits/kits.lock.json]
    tools: []

  - id: board
    order: 4
    name: board
    cluster: office
    kitId: kit.board
    planet: { en: Doodle Planet, zh: 涂鸦星 }
    ext: .kboard
    color: { light: "#966e00", dark: "#ffd04d" }
    surface: { style: patches, look: terra, size: 1.0, moons: 1 }
    # what the globe looks like on the star map, in words (keep it true to `surface`)
    world:
      en: "A warm ocean world with scattered continents and drifting clouds, as loose as a sketch on a whiteboard. It has one moon."
      zh: "一颗温暖的海洋星球，零散的大陆和飘动的云，像白板上随手画的草图。有一颗卫星。"
    tagline:
      en: An infinite whiteboard where AI proposes and you decide.
      zh: 无限白板，AI 提方案，你来定。
    summary:
      en: >-
        board is an infinite canvas for diagrams, mind maps, flowcharts, sticky-note clusters and freeform
        sketches. The agent works in a draft of the board that you review before it lands.
      zh: board 是一块无限画布，画流程图、思维导图、便利贴分组和随手草图。Agent 在白板的草稿里修改，你审阅之后才落到白板上。
    capabilities:
      - id: canvas
        building: { en: Sticky Note Plaza, zh: 便利贴广场 }
        shape: block
        title: { en: Infinite canvas, zh: 无限画布 }
        body:
          en: Shapes, sticky notes and freeform sketches on a canvas with no edges.
          zh: 在没有边界的画布上放形状、便利贴和随手草图。
      - id: diagrams
        building: { en: Mind Map Tower, zh: 思维导图塔 }
        shape: spire
        title: { en: Diagrams and mind maps, zh: 流程图和思维导图 }
        body:
          en: Build diagrams, mind maps and flowcharts.
          zh: 画流程图、思维导图和各种示意图。
      - id: connectors
        building: { en: Connector Bridge, zh: 连线大桥 }
        shape: columns
        title: { en: Connectors, frames and pages, zh: 连线、框架和页面 }
        body:
          en: Connectors that stay bound to their shapes, groups, frames and multiple pages.
          zh: 连线始终绑在形状上，支持分组、框架和多页。
      - id: proposals
        building: { en: Proposal Booth, zh: 提案亭 }
        shape: screen
        title: { en: Reviewable AI changes, zh: 可审阅的 AI 修改 }
        body:
          en: The agent proposes changes to the board; you accept or reject them before they apply.
          zh: Agent 对白板提出修改，你接受或拒绝之后才生效。
      - id: export
        building: { en: Export Kiosk, zh: 导出小亭 }
        shape: dome
        title: { en: SVG and PNG export, zh: 导出 SVG 和 PNG }
        body:
          en: Export a board as SVG or PNG.
          zh: 把白板导出成 SVG 或 PNG。
    formats:
      native: [".kboard"]
      opens: []
    commands:
      - { name: element.create, what: { en: Add shapes and notes, zh: 添加形状和便利贴 } }
      - { name: element.update, what: { en: Move or restyle elements, zh: 移动或修改元素样式 } }
      - { name: connector.create, what: { en: Connect two elements, zh: 连接两个元素 } }
      - { name: element.group, what: { en: Group elements, zh: 编组 } }
      - { name: page.create, what: { en: Add a page, zh: 新增页面 } }
      - { name: element.reorder, what: { en: Change stacking order, zh: 调整层级 } }
    ship:
      en: Agent ship landing on board to turn a brainstorm into a mind map
      zh: Agent 飞船降落 board，把头脑风暴整理成思维导图
    repo: KitionAI/kition · packages/board-kit
    sources: [README.md, packages/board-kit/kit.json, packages/board-kit/src/engine/boardModel.ts, src-tauri/src/workspace/formats.rs]
    tools: []

  # ───────────────────────────── Design ─────────────────────────────
  - id: photo
    order: 5
    name: photo
    cluster: design
    kitId: kit.photo
    planet: { en: Darkroom Planet, zh: 暗房星 }
    ext: .psd
    version: 0.4.16
    color: { light: "#087fa1", dark: "#4ccbf0" }
    surface: { style: swirl, look: storm, size: 1.1, tilt: 0.5 }
    # what the globe looks like on the star map, in words (keep it true to `surface`)
    world:
      en: "An ice giant wrapped in slow turquoise storms that fold over one another, like the layers of an image."
      zh: "一颗冰巨星，青蓝色的风暴缓慢地互相叠在一起，像一张图里的图层。"
    tagline:
      en: Layered image editing that opens and saves PSD files, for you and your AI.
      zh: 能打开和保存 PSD 的分层图像编辑，你和 AI 都能用。
    summary:
      en: >-
        photo edits layered images: layers and groups, layer masks and clipping masks, adjustment layers,
        type, layer styles and brush strokes, saved to PSD. It opens PSD and PSB files directly, and an agent
        can run the same commands you use.
      zh: photo 编辑分层图像：图层和图层组、图层蒙版和剪贴蒙版、调整图层、文字、图层样式和画笔，存成 PSD。它直接打开 PSD 和 PSB，Agent 能执行和你一样的命令。
    capabilities:
      - id: psd
        building: { en: PSD Darkroom, zh: PSD 暗房 }
        shape: dome
        title: { en: Opens PSD and PSB, zh: 打开 PSD 和 PSB }
        body:
          en: Open PSD, PSB and .kphoto files; new files are saved as PSD.
          zh: 打开 PSD、PSB 和 .kphoto 文件；新建文件默认存成 PSD。
      - id: layers
        building: { en: Layer Stacks, zh: 图层大楼 }
        shape: stack
        title: { en: Layers and masks, zh: 图层和蒙版 }
        body:
          en: Layers, layer masks and clipping masks, duplicated, reordered and flattened on demand.
          zh: 图层、图层蒙版和剪贴蒙版，可以复制、调序、按需合并。
      - id: adjust
        building: { en: Curves Lab, zh: 曲线实验室 }
        shape: tower
        title: { en: Adjustment layers, zh: 调整图层 }
        body:
          en: Levels, curves, vibrance, hue/saturation and more as non-destructive adjustment layers.
          zh: 色阶、曲线、自然饱和度、色相/饱和度等，都是不破坏原图的调整图层。
      - id: paint
        building: { en: Brush Studio, zh: 笔刷工作室 }
        shape: block
        title: { en: Paint, select, transform, type, zh: 绘画、选区、变换、文字 }
        body:
          en: Paint strokes, selections, transforms, filters and type.
          zh: 画笔、选区、变换、滤镜和文字。
      - id: export
        building: { en: Export Pier, zh: 导出码头 }
        shape: crane
        title: { en: Export, zh: 导出 }
        body:
          en: Export PNG, JPG, PSD or TIFF, layers to files, and artboards to PDF.
          zh: 导出 PNG、JPG、PSD、TIFF，把图层导出成文件，把画板导出成 PDF。
    formats:
      native: [".psd", ".kphoto"]
      opens: [".psb"]
    commands:
      - { name: layer.new.layer, what: { en: Add a layer, zh: 新建图层 } }
      - { name: layer.newAdjustmentLayer.curves, what: { en: Add a curves layer, zh: 新建曲线调整图层 } }
      - { name: image.adjustments.brightnessContrast, what: { en: Adjust brightness and contrast, zh: 调亮度和对比度 } }
      - { name: select.rect, what: { en: Make a rectangular selection, zh: 矩形选区 } }
      - { name: paint.stroke, what: { en: Paint a stroke, zh: 画一笔 } }
      - { name: layer.createClippingMask, what: { en: Create a clipping mask, zh: 创建剪贴蒙版 } }
      - { name: layer.flattenImage, what: { en: Flatten the image, zh: 合并图像 } }
    ship:
      en: Agent ship landing on photo to add a curves layer to a PSD
      zh: Agent 飞船降落 photo，给 PSD 加一个曲线调整图层
    repo: KitionAI/kition-photo
    sources: [crates/kition-kits/src/manager.rs, src/features/workspace/components/kits/kitFormats.ts, src/lib/script/kits/photo.ts, kits/kits.lock.json]
    tools: []

  # ───────────────────────────── Video ─────────────────────────────
  - id: film
    order: 6
    name: film
    cluster: video
    kitId: kit.film
    planet: { en: Cinema Planet, zh: 电影星 }
    ext: .kfilm
    version: 0.4.3
    color: { light: "#2d2f3a", dark: "#a3a7b8" }
    surface: { style: bands, look: gas, size: 1.12, ring: true, tilt: 0.12 }
    # what the globe looks like on the star map, in words (keep it true to `surface`)
    world:
      en: "A grey banded giant with a wide ring, like a reel of film seen from the side."
      zh: "一颗灰色条纹的巨行星，带着一圈宽星环，像从侧面看的一盘胶片。"
    tagline:
