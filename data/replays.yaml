# Agent replays: a real kition-showcase sample replayed step by step for a (kit, scenario).
#
# `sample` is a folder in the kition-showcase repo (<kit>/<slug>/showcase.yaml). `upto` counts
# top-level entries of that file's `steps:` list (1-based; the film `prelude:` is not counted),
# and the last frame's `upto` equals the total number of steps. `lights` are capability ids of
# the same kit in data/universe.yaml. One sample is used at most once.
#
# Galaxy (kit, scenario) pairs from src/lib/scenarioGalaxies.ts that are SKIPPED, because no
# sample of that kit really does the scenario:
#   doc / contract-review    - the contract samples only write a contract; none uses review tools,
#                              password protection or PDF export.
#   slide / training-deck    - no slide sample inserts audio or video.
#   pdf / searchable-scans   - no pdf sample runs OCR or converts to PDF/A.
#   vector / recolor         - no vector sample opens an .ai file or recolours a whole illustration.
#   html / responsive-page   - no html sample changes the viewport size or colour scheme.
#
# Loose matches (kept; the goal says what the sample really does):
#   note / design-doc        - a formula sheet with LaTeX math, not a design doc; no Mermaid sample exists.
#   photo / product-retouch  - Hue/Saturation adjustment layers on fabric swatches, not a product photo.
#   photo / social-set       - one Instagram image; no photo sample has export steps.
#   film / interview-cut     - a lower third over interview footage; no splitting or trimming.
#   layout / brochure        - a community garden tri-fold, not a product brochure.
#
# html: ten of the eleven html samples are a single `html.setSource` step, so the landing-page
# entry can only have ONE frame (the schema asks for 3 to 5). The only html sample with more
# steps is html/help-centre-tabs-accordion (3 steps), which matches no html scenario.

# ── note ─────────────────────────────────────────────────────────────────────
- kit: note
  scenario: research-wiki
  sample: note/sourdough-starter-guide
  goal:
    en: Write a sourdough starter guide that links to the neighbouring notes.
    zh: 写一篇酸面团酵头指南，并链接到相关的笔记。
  frames:
    - upto: 1
      say: { en: Write the guide with wikilinks and callouts, zh: 写下指南，带双链和提示块 }
      lights: [links]
    - upto: 4
      say: { en: Add a link to Hydration Ratios, zh: 补一个指向“含水率”笔记的链接 }
      lights: [links]
    - upto: 6
      say: { en: Give the feeding paragraph a block id, zh: 给喂养那一段加上块 ID }
      lights: [links]
    - upto: 7
      say: { en: List every link in the note, zh: 列出笔记里的所有链接 }
      lights: [links]

- kit: note
  scenario: design-doc
  sample: note/mechanics-revision-formulas
  goal:
    en: Write a mechanics formula sheet with the formulas set as LaTeX math.
    zh: 写一份力学公式复习单，公式用 LaTeX 排版。
  frames:
    - upto: 1
      say: { en: Write the formula sheet in Markdown and LaTeX, zh: 用 Markdown 和 LaTeX 写出公式单 }
      lights: [diagrams]
    - upto: 4
      say: { en: Turn the last formula into a math block, zh: 把最后一条公式改成公式块 }
      lights: [diagrams]
    - upto: 5
      say: { en: Read the source back to check it, zh: 读回源文本做检查 }
      lights: [diagrams]

- kit: note
  scenario: meeting-notes
  sample: note/weekly-team-sync
  goal:
    en: Write up the weekly sync, tick off the finished actions and comment on one decision.
    zh: 整理周会记录，勾掉已完成的行动项，并对一条决定留下评论。
  frames:
    - upto: 1
      say: { en: Write up the meeting notes, zh: 写下会议记录 }
      lights: [review]
    - upto: 4
      say: { en: Tick off two finished action items, zh: 勾掉两条已完成的行动项 }
      lights: [review]
    - upto: 5
      say: { en: Mark the notes as reviewed, zh: 把记录状态改为已审阅 }
      lights: [review]
    - upto: 6
      say: { en: Comment on the offline-data decision, zh: 对离线数据那条决定加评论 }
      lights: [comments]

